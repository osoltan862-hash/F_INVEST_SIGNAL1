<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Support Rebound Scanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .header p {
            margin: 0;
            color: #94a3b8;
        }

        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 180px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #cbd5e1;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .secondary {
            background: #475569;
        }

        .secondary:hover {
            background: #334155;
        }

        .signal {
            text-align: center;
            padding: 18px;
            border-radius: 12px;
            background: #0f172a;
            margin-bottom: 16px;
        }

        .signal-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .confirmed {
            color: #22c55e;
        }

        .not-confirmed {
            color: #f59e0b;
        }

        .symbol {
            font-size: 20px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .item {
            background: #0f172a;
            border-radius: 10px;
            padding: 13px;
            border: 1px solid #334155;
        }

        .item-title {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .item-value {
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        .levels {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .level {
            padding: 14px 8px;
            border-radius: 10px;
            background: #0f172a;
            text-align: center;
            border: 1px solid #334155;
        }

        .level-name {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .level-value {
            font-size: 17px;
            font-weight: bold;
        }

        .conditions {
            margin-top: 10px;
        }

        .condition {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px;
            margin-bottom: 7px;
            border-radius: 8px;
            background: #0f172a;
        }

        .ok {
            color: #22c55e;
            font-weight: bold;
        }

        .bad {
            color: #ef4444;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
        }

        .error {
            background: #450a0a;
            color: #fecaca;
            padding: 14px;
            border-radius: 10px;
            margin-top: 12px;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            padding: 10px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }

            .levels {
                grid-template-columns: repeat(2, 1fr);
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 Support Rebound Scanner</h1>
        <p>فحص ارتداد مبكر من مناطق الدعم</p>
    </div>

    <!-- اختيار العملة -->
    <div class="card">

        <div class="form-row">

            <div class="form-group">
                <label for="symbol">العملة</label>

                <input
                    id="symbol"
                    list="symbolsList"
                    value="BTC/USDT"
                    placeholder="مثال: BTC/USDT"
                    autocomplete="off"
                >

                <datalist id="symbolsList"></datalist>
            </div>

            <div class="form-group">
                <label for="timeframe">الفريم</label>

                <input
                    id="timeframe"
                    value="5m"
                    disabled
                >
            </div>

            <div class="form-group">
                <label for="market">السوق</label>

                <input
                    value="Binance Spot"
                    disabled
                >
            </div>

        </div>

        <button onclick="scanSymbol()">
            🔍 فحص العملة الآن
        </button>

        <button
            class="secondary"
            onclick="loadSymbols()"
        >
            🔄 تحديث قائمة العملات
        </button>

        <div id="error"></div>

    </div>


    <!-- النتيجة -->
    <div id="result">

        <div class="card loading">
            اختر العملة واضغط على "فحص العملة الآن"
        </div>

    </div>


    <div class="footer">
        Support Rebound Scanner — Binance Spot
    </div>

</div>


<script>

let symbols = [];


/* ==========================================
   تحميل قائمة العملات
========================================== */

async function loadSymbols() {

    const errorBox = document.getElementById("error");

    errorBox.innerHTML = "";

    try {

        const response = await fetch("/api/symbols");

        if (!response.ok) {
            throw new Error("تعذر تحميل قائمة العملات");
        }

        const data = await response.json();

        symbols = data.symbols || [];

        const list = document.getElementById("symbolsList");

        list.innerHTML = "";

        symbols.forEach(symbol => {

            const option = document.createElement("option");

            option.value = symbol;

            list.appendChild(option);

        });

    } catch (error) {

        errorBox.innerHTML =
            `<div class="error">${error.message}</div>`;

    }

}


/* ==========================================
   فحص العملة
========================================== */

async function scanSymbol() {

    const symbolInput =
        document.getElementById("symbol");

    const symbol =
        symbolInput.value.trim();

    const result =
        document.getElementById("result");

    const errorBox =
        document.getElementById("error");

    errorBox.innerHTML = "";

    if (!symbol) {

        errorBox.innerHTML =
            `<div class="error">
                أدخل اسم العملة أولاً.
            </div>`;

        return;
    }


    result.innerHTML = `
        <div class="card loading">
            ⏳ جاري فحص ${symbol}...
        </div>
    `;


    try {

        const response =
            await fetch(
                `/api/scan?symbol=${encodeURIComponent(symbol)}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "حدث خطأ أثناء الفحص"
            );

        }


        renderResult(data);


    } catch (error) {

        result.innerHTML = `
            <div class="card">

                <div class="error">
                    ❌ ${escapeHtml(error.message)}
                </div>

            </div>
        `;

    }

}


/* ==========================================
   عرض النتيجة
========================================== */

function renderResult(data) {

    const result =
        document.getElementById("result");


    const confirmed =
        Boolean(data.confirmed);


    const signalClass =
        confirmed
            ? "confirmed"
            : "not-confirmed";


    const signalText =
        data.signal ||
        "NO CONFIRMED SIGNAL";


    const conditions =
        data.conditions || {};


    result.innerHTML = `

        <div class="card">

            <div class="signal">

                <div class="symbol">
                    ${escapeHtml(data.symbol || "-")}
                </div>

                <div class="signal-title ${signalClass}">
                    ${escapeHtml(signalText)}
                </div>

                <div>
                    ${confirmed
                        ? "✅ جميع شروط الاستراتيجية متحققة"
                        : "⚠️ لا توجد إشارة مكتملة حالياً"
                    }
                </div>

            </div>


            <!-- بيانات السوق -->

            <div class="grid">

                <div class="item">
                    <div class="item-title">
                        السعر / Entry
                    </div>

                    <div class="item-value">
                        ${formatNumber(data.price)}
                    </div>
                </div>


                <div class="item">
                    <div class="item-title">
                        الهبوط السابق
                    </div>

                    <div class="item-value">
                        ${formatPercent(data.drop_percent)}
                    </div>
                </div>


                <div class="item">
                    <div class="item-title">
                        الدعم
                    </div>

                    <div class="item-value">
                        ${formatNumber(data.support)}
                    </div>
                </div>


                <div class="item">
                    <div class="item-title">
                        المسافة عن الدعم
                    </div>

                    <div class="item-value">
                        ${formatPercent(data.support_distance_percent)}
                    </div>
                </div>


                <div class="item">
                    <div class="item-title">
                        Volume Ratio
                    </div>

                    <div class="item-value">
                        ${formatNumber(data.volume_ratio, 2)}x
                    </div>
                </div>


                <div class="item">
                    <div class="item-title">
                        WMA 50
                    </div>

                    <div class="item-value">
                        ${formatNumber(data.wma_fast)}
                    </div>
                </div>


                <div class="item">
                    <div class="item-title">
                        WMA 103
                    </div>

                    <div class="item-value">
                        ${formatNumber(data.wma_slow)}
                    </div>
                </div>


                <div class="item">
                    <div class="item-title">
                        Timeframe
                    </div>

                    <div class="item-value">
                        ${escapeHtml(data.timeframe || "5m")}
                    </div>
                </div>

            </div>

        </div>


        <!-- Entry / SL / TP -->

        <div class="card">

            <h3>
                🎯 مستويات الصفقة
            </h3>

            <div class="levels">

                <div class="level">

                    <div class="level-name">
                        Entry
                    </div>

                    <div class="level-value">
                        ${formatNumber(data.entry)}
                    </div>

                </div>


                <div class="level">

                    <div class="level-name">
                        SL -3%
                    </div>

                    <div class="level-value">
                        ${formatNumber(data.sl)}
                    </div>

                </div>


                <div class="level">

                    <div class="level-name">
                        TP1 +1%
                    </div>

                    <div class="level-value">
                        ${formatNumber(data.tp1)}
                    </div>

                </div>


                <div class="level">

                    <div class="level-name">
                        TP2 +2%
                    </div>

                    <div class="level-value">
                        ${formatNumber(data.tp2)}
                    </div>

                </div>


                <div class="level">

                    <div class="level-name">
                        TP3 +3%
                    </div>

                    <div class="level-value">
                        ${formatNumber(data.tp3)}
                    </div>

                </div>

            </div>

        </div>


        <!-- شروط الاستراتيجية -->

        <div class="card">

            <h3>
                🔎 شروط الاستراتيجية
            </h3>

            <div class="conditions">

                ${conditionRow(
                    "هبوط سابق ≥ 3%",
                    conditions.drop
                )}

                ${conditionRow(
                    "ملامسة منطقة الدعم",
                    conditions.support
                )}

                ${conditionRow(
                    "شمعة رفض صاعدة",
                    conditions.rejection
                )}

                ${conditionRow(
                    "تأكيد حجم التداول",
                    conditions.volume
                )}

                ${conditionRow(
                    "WMA 50 يتجه للأعلى",
                    conditions.wma_turning_up
                )}

            </div>

        </div>


        <!-- آخر تحديث -->

        <div class="card">

            <div class="item">

                <div class="item-title">
                    آخر تحديث
                </div>

                <div class="item-value">
                    ${formatDate(data.timestamp)}
                </div>

            </div>

        </div>
    `;
}


/* ==========================================
   صف شرط
========================================== */

function conditionRow(name, value) {

    const ok =
        Boolean(value);


    return `

        <div class="condition">

            <span>
                ${name}
            </span>

            <span class="${ok ? "ok" : "bad"}">
                ${ok ? "✓ متحقق" : "✗ غير متحقق"}
            </span>

        </div>
    `;
}


/* ==========================================
   تنسيق الأرقام
========================================== */

function formatNumber(value, decimals = null) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return "-";
    }


    const number =
        Number(value);


    if (decimals !== null) {

        return number.toFixed(decimals);

    }


    if (Math.abs(number) >= 1000) {

        return number.toFixed(2);

    }


    if (Math.abs(number) >= 1) {

        return number.toFixed(4);

    }


    if (Math.abs(number) >= 0.01) {

        return number.toFixed(6);

    }


    return number.toFixed(8);
}


/* ==========================================
   النسب المئوية
========================================== */

function formatPercent(value) {

    if (
        value === null ||
        value === undefined ||
        Number.isNaN(Number(value))
    ) {
        return "-";
    }


    return Number(value).toFixed(2) + "%";
}


/* ==========================================
   التاريخ
========================================== */

function formatDate(value) {

    if (!value) {
        return "-";
    }


    try {

        return new Date(value).toLocaleString(
            "ar-MA"
        );

    } catch {

        return value;

    }
}


/* ==========================================
   حماية النص
========================================== */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================================
   Enter = فحص
========================================== */

document
    .getElementById("symbol")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                scanSymbol();

            }

        }
    );


/* ==========================================
   تحميل العملات عند فتح الموقع
========================================== */

loadSymbols();

</script>

</body>
</html>
